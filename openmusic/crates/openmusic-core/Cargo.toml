[package]
name = "openmusic-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
# Blocking HTTPS client (rustls) for LRCLIB lyrics lookups.
ureq = "2"
